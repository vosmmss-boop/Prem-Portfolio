    <!-- GitHub Pages Single Page App Deep Link URL Restorer -->
    <script type="text/javascript">
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            var restored = decodeURIComponent(q.p);
            var hash = q.h ? '#' + decodeURIComponent(q.h) : '';
            var targetUrl = (restored.charAt(0) === '/' ? restored : '/' + restored) + hash;
            window.history.replaceState(null, null, targetUrl);
          }
        }
      }(window.location));
    </script>

    <!-- Skeleton Hydration, 0ms Frame-Zero Load & Hash Route Synchronizer -->
    <script type="text/javascript">
      (function() {
        function evaluateHydrationAndRoutes() {
          var skeleton = document.getElementById('app-skeleton');
          var root = document.getElementById('root');
          var hash = (window.location.hash || '').toLowerCase();
          var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '');

          // 1. Intercept legacy pathname routes -> Redirect to hash fragment without static host 404
          if (path === '/admin' || path === '/webadminprem') {
            window.location.replace('/#drpremlogin');
            return;
          }
          if (path === '/inquires' || path === '/inquiries' || path === '/inq-prem') {
            window.location.replace('/#drpreminq');
            return;
          }

          // 2. Check for window.INITIAL_LATEST_DATA injected by Cloudflare Worker
          var hasInjectedData = Boolean(window.INITIAL_LATEST_DATA);
          var hasLocalCache = false;
          try {
            hasLocalCache = Boolean(localStorage.getItem('dr_joshi_branding'));
          } catch (e) {}

          if (hasInjectedData) {
            try {
              var raw = window.INITIAL_LATEST_DATA;
              var parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
              window.INITIAL_LATEST_DATA = parsed;
            } catch (err) {
              console.warn('[Hydration] Failed to parse INITIAL_LATEST_DATA:', err);
            }
            // 0ms Latency: immediately hide skeleton & display hydrated page content
            if (skeleton) skeleton.style.display = 'none';
            if (root) root.style.display = 'block';
          } else if (hasLocalCache) {
            // Local storage cache present: render frame-zero without skeleton flash
            if (skeleton) skeleton.style.display = 'none';
            if (root) root.style.display = 'block';
          } else {
            // Neither injected data nor cache present: display skeleton while Firebase fetches
            if (skeleton) skeleton.style.display = 'block';
          }

          // 3. Hash Route Handling (#drpremlogin & #drpreminq)
          if (hash.indexOf('drpremlogin') > -1) {
            if (skeleton) skeleton.style.display = 'none';
            if (root) root.style.display = 'block';
          } else if (hash.indexOf('drpreminq') > -1) {
            if (skeleton) skeleton.style.display = 'none';
            if (root) root.style.display = 'block';
            var inqSec = document.getElementById('inquiry-section');
            if (inqSec) {
              inqSec.scrollIntoView({ behavior: 'smooth' });
            }
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', evaluateHydrationAndRoutes);
        } else {
          evaluateHydrationAndRoutes();
        }
        window.addEventListener('hashchange', evaluateHydrationAndRoutes);
      })();
    </script>

    <!-- Immediate Dynamic Favicon Synchronizer: Applies Doctor Logo as Favicon before React loads -->
    <script type="text/javascript">
      (function() {
        try {
          var fav = localStorage.getItem('dr_joshi_custom_favicon');
          if (!fav) {
            var b = localStorage.getItem('dr_joshi_branding');
            if (b) {
              var parsed = JSON.parse(b);
              if (parsed && parsed.logoUrl && !parsed.logoUrl.startsWith('data:')) {
                fav = parsed.logoUrl;
              }
            }
          }
          if (fav) {
            var links = document.querySelectorAll("link[rel*='icon']");
            for (var i = 0; i < links.length; i++) {
              links[i].href = fav;
            }
          }
        } catch (e) {}
      })();
    </script>
