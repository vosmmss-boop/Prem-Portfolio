name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite App (Outputs to ./dist)
        run: npm run build

      - name: Prepare GitHub Pages Assets (SPA 404 & CNAME & .nojekyll)
        run: |
          # Copy index.html to 404.html and static route folders so direct URLs (/webadminprem, /inq-prem, /track, /appointment) return HTTP 200 OK
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
            mkdir -p dist/webadminprem dist/admin dist/inq-prem dist/inquiries dist/track dist/appointment dist/gallery
            cp dist/index.html dist/webadminprem/index.html
            cp dist/index.html dist/admin/index.html
            cp dist/index.html dist/inq-prem/index.html
            cp dist/index.html dist/inquiries/index.html
            cp dist/index.html dist/track/index.html
            cp dist/index.html dist/appointment/index.html
            cp dist/index.html dist/gallery/index.html
          fi

          # Ensure custom domain CNAME is present in dist
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          elif [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          fi

          # Ensure Jekyll is disabled so all assets are served verbatim
          touch dist/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
